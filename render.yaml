services:
  - type: web
    name: pcbuilder-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    healthCheckPath: /api/health
    startCommand: npm start
    envVars:
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: SERPAPI_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
